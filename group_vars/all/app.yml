# Non-secret settings. The secrets live in secrets.yml, in the Keybase team folder below
# (see secrets.yml.example at the root of the repository). This is your Keybase mount when
# deploying by hand; the CI overrides it with its own copy of the folder.
secrets_dir: "/keybase/team/cepro_crust"

# TODO: replace with the real DNS name once the VM and the name are granted
crust_fqdn: "crust.epfl.ch"

# true: temporary certificate from Caddy's own CA (browser warning).
# false: real certificate from the IT, taken from secrets.yml (crust_tls_*).
crust_tls_selfsigned: true

crust_tz: "Europe/Zurich"

# Attachment size accepted by nginx (Zammad has its own limit in the admin settings).
crust_max_attachment_size: "20M"

# Daily backup made by the zammad-backup service (kept in the zammad-backup volume).
crust_backup_time: "03:00"
crust_backup_hold_days: 10

# Export the backups to the NAS share (needs crust_cifs_credentials in secrets.yml).
crust_nas_backup_enabled: true
