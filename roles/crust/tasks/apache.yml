- name: Enable required Apache proxy modules
  community.general.apache2_module:
    name: "{{ item }}"
    state: present
  loop:
    - proxy
    - proxy_http
    - proxy_wstunnel
    - headers
    - rewrite
    - ssl

- name: Ensure Apache certs repository exists
  file:
    state: directory
    path: "{{ item }}"
    mode: '0755'
  with_items:
    - /etc/ssl/
    - /etc/ssl/certs/
    - /etc/ssl/certs/crust/

# Temporary self-signed certificate (browsers show a warning), until the IT delivers a real one.
# Not regenerated as long as the key exists: delete the key to renew it.
- name: Generate a self-signed certificate
  ansible.builtin.command:
    argv:
      - openssl
      - req
      - -x509
      - -nodes
      - -newkey
      - rsa:2048
      - -days
      - "365"
      - -subj
      - "/CN={{ crust_fqdn }}"
      - -addext
      - "subjectAltName=DNS:{{ crust_fqdn }}"
      - -keyout
      - /etc/ssl/certs/crust/crust-serveur.key
      - -out
      - "/etc/ssl/certs/crust/{{ crust_fqdn | replace('.', '_') }}-crt.pem"
    creates: /etc/ssl/certs/crust/crust-serveur.key
  when: crust_tls_selfsigned | default(false)

# Real certificate: the TLS key and certificates come from the vault.
- name: Install the TLS key and certificates
  copy:
    content: "{{ item.content }}"
    dest: "/etc/ssl/certs/crust/{{ item.dest }}"
    owner: root
    mode: '0600'
  loop:
    - { dest: crust-serveur.key, content: "{{ crust_tls_key }}" }
    - { dest: DigiCertCA.crt, content: "{{ crust_tls_chain }}" }
    - { dest: "{{ crust_fqdn | replace('.', '_') }}-crt.pem", content: "{{ crust_tls_cert }}" }
  when: not (crust_tls_selfsigned | default(false))
  no_log: true

- name: Create Apache virtual host configuration
  ansible.builtin.template:
    src: crust.conf.j2
    dest: /etc/apache2/sites-available/crust.conf
    owner: root
    group: root
    mode: '0644'

- name: Enable CRUST site and reload Apache
  ansible.builtin.shell: |
    a2ensite crust.conf
    systemctl reload apache2
